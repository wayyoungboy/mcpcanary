<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">MCPCanary hero graphic</title>
  <desc id="desc">A dark product banner for MCPCanary, showing local MCP scanning, trust lockfiles, and drift detection.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset="0.48" stop-color="#172554"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8fafc" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#f8fafc" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="shadow" x="-40" y="-40" width="1360" height="720" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
  </defs>
  <rect width="1280" height="640" rx="36" fill="url(#bg)"/>
  <path d="M70 120C182 39 313 43 434 101C558 161 660 261 799 250C941 239 1037 118 1216 91" stroke="#38bdf8" stroke-opacity="0.28" stroke-width="3"/>
  <path d="M45 519C154 443 270 417 407 461C521 498 629 593 772 563C927 531 1021 386 1228 404" stroke="#facc15" stroke-opacity="0.3" stroke-width="3"/>

  <g filter="url(#shadow)">
    <rect x="72" y="78" width="1136" height="484" rx="28" fill="url(#card)" stroke="#e2e8f0" stroke-opacity="0.18"/>
  </g>

  <g transform="translate(116 125)">
    <rect x="0" y="0" width="74" height="74" rx="20" fill="#facc15"/>
    <path d="M47 22C55 27 59 34 59 43C59 56 49 64 36 64C22 64 13 55 13 42C13 29 22 18 35 18C39 18 43 19 47 22Z" fill="#111827"/>
    <path d="M47 22C53 20 60 21 65 25C60 26 55 29 51 34" fill="#f8fafc"/>
    <circle cx="39" cy="36" r="4" fill="#facc15"/>
  </g>

  <text x="116" y="242" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="74" font-weight="800" letter-spacing="0">MCPCanary</text>
  <text x="120" y="291" fill="#bfdbfe" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="600" letter-spacing="0">Local-first MCP trust scanner and semantic drift canary</text>
  <text x="120" y="342" fill="#e2e8f0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" letter-spacing="0">Scan risky MCP configs before your agent connects. Lock approved descriptors. Catch semantic drift before it turns into a supply-chain surprise.</text>

  <g transform="translate(120 404)">
    <rect x="0" y="0" width="172" height="48" rx="12" fill="#facc15"/>
    <text x="24" y="31" fill="#111827" font-family="Inter, ui-sans-serif, system-ui" font-size="18" font-weight="800">scan</text>
    <path d="M83 24H147" stroke="#111827" stroke-width="3" stroke-linecap="round"/>
    <path d="M138 15L147 24L138 33" stroke="#111827" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(318 404)">
    <rect x="0" y="0" width="172" height="48" rx="12" fill="#38bdf8"/>
    <text x="24" y="31" fill="#082f49" font-family="Inter, ui-sans-serif, system-ui" font-size="18" font-weight="800">lock</text>
    <path d="M83 24H147" stroke="#082f49" stroke-width="3" stroke-linecap="round"/>
    <path d="M138 15L147 24L138 33" stroke="#082f49" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(516 404)">
    <rect x="0" y="0" width="172" height="48" rx="12" fill="#34d399"/>
    <text x="24" y="31" fill="#052e1f" font-family="Inter, ui-sans-serif, system-ui" font-size="18" font-weight="800">diff</text>
    <path d="M83 24H147" stroke="#052e1f" stroke-width="3" stroke-linecap="round"/>
    <path d="M138 15L147 24L138 33" stroke="#052e1f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(760 136)">
    <rect x="0" y="0" width="370" height="318" rx="20" fill="#020617" stroke="#475569" stroke-opacity="0.8"/>
    <circle cx="28" cy="27" r="6" fill="#ef4444"/>
    <circle cx="49" cy="27" r="6" fill="#facc15"/>
    <circle cx="70" cy="27" r="6" fill="#22c55e"/>
    <text x="28" y="72" fill="#93c5fd" font-family="SFMono-Regular, ui-monospace, Menlo, monospace" font-size="17">$ mcpcanary scan mcp.json</text>
    <text x="28" y="116" fill="#f8fafc" font-family="SFMono-Regular, ui-monospace, Menlo, monospace" font-size="17">Risk: HIGH</text>
    <text x="28" y="160" fill="#fca5a5" font-family="SFMono-Regular, ui-monospace, Menlo, monospace" font-size="16">MCPCANARY-001 override</text>
    <text x="28" y="194" fill="#fde68a" font-family="SFMono-Regular, ui-monospace, Menlo, monospace" font-size="16">MCPCANARY-003 secret env</text>
    <text x="28" y="228" fill="#86efac" font-family="SFMono-Regular, ui-monospace, Menlo, monospace" font-size="16">semantic drift: blocked</text>
    <rect x="28" y="260" width="314" height="28" rx="8" fill="#172554"/>
    <rect x="28" y="260" width="86" height="28" rx="8" fill="#facc15"/>
  </g>
</svg>
