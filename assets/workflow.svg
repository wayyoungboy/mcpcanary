<svg width="1120" height="420" viewBox="0 0 1120 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">MCPCanary workflow</title>
  <desc id="desc">A workflow showing scan, lock, and diff stages for MCP trust review.</desc>
  <rect width="1120" height="420" rx="28" fill="#f8fafc"/>
  <text x="56" y="70" fill="#0f172a" font-family="Inter, ui-sans-serif, system-ui" font-size="34" font-weight="800">Trust workflow</text>
  <text x="56" y="108" fill="#475569" font-family="Inter, ui-sans-serif, system-ui" font-size="18">Review MCP tools before connection, then keep watching for descriptor drift.</text>

  <g transform="translate(56 158)">
    <rect width="260" height="170" rx="18" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="24" y="45" fill="#1d4ed8" font-family="Inter, ui-sans-serif, system-ui" font-size="24" font-weight="800">1. scan</text>
    <text x="24" y="84" fill="#334155" font-family="Inter, ui-sans-serif, system-ui" font-size="16">Parse MCP config without</text>
    <text x="24" y="108" fill="#334155" font-family="Inter, ui-sans-serif, system-ui" font-size="16">executing untrusted servers.</text>
    <text x="24" y="140" fill="#0f172a" font-family="SFMono-Regular, ui-monospace, Menlo, monospace" font-size="14">mcpcanary scan</text>
  </g>

  <path d="M342 243H436" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <path d="M422 228L438 243L422 258" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(464 158)">
    <rect width="260" height="170" rx="18" fill="#fefce8" stroke="#fde68a"/>
    <text x="24" y="45" fill="#a16207" font-family="Inter, ui-sans-serif, system-ui" font-size="24" font-weight="800">2. lock</text>
    <text x="24" y="84" fill="#334155" font-family="Inter, ui-sans-serif, system-ui" font-size="16">Save approved descriptors,</text>
    <text x="24" y="108" fill="#334155" font-family="Inter, ui-sans-serif, system-ui" font-size="16">hashes, and semantic vectors.</text>
    <text x="24" y="140" fill="#0f172a" font-family="SFMono-Regular, ui-monospace, Menlo, monospace" font-size="14">mcpcanary lock</text>
  </g>

  <path d="M750 243H844" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <path d="M830 228L846 243L830 258" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(872 158)">
    <rect width="192" height="170" rx="18" fill="#ecfdf5" stroke="#bbf7d0"/>
    <text x="24" y="45" fill="#047857" font-family="Inter, ui-sans-serif, system-ui" font-size="24" font-weight="800">3. diff</text>
    <text x="24" y="84" fill="#334155" font-family="Inter, ui-sans-serif, system-ui" font-size="16">Block added, removed,</text>
    <text x="24" y="108" fill="#334155" font-family="Inter, ui-sans-serif, system-ui" font-size="16">or drifted tools.</text>
    <text x="24" y="140" fill="#0f172a" font-family="SFMono-Regular, ui-monospace, Menlo, monospace" font-size="14">mcpcanary diff</text>
  </g>
</svg>
